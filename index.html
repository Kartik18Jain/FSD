<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <style>
    :root {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #2c3e50;
      background: #eef2f7;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #f4f7ff 0%, #eef2f7 100%);
    }
    .container {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(28, 50, 90, 0.12);
      padding: 32px 30px;
    }
    .container h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0.3px;
    }
    .container p {
      margin: 0 0 26px;
      color: #687692;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .form-control,
    .form-select {
      width: 100%;
      border: 1px solid #d6dce7;
      border-radius: 14px;
      padding: 14px 16px;
      background: #f8fbff;
      color: #2c3e50;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .form-control:focus,
    .form-select:focus {
      outline: none;
      border-color: #5f7bff;
      box-shadow: 0 0 0 4px rgba(95, 123, 255, 0.14);
      background: #ffffff;
    }
    .row {
      display: flex;
      gap: 14px;
    }
    .row .form-group {
      flex: 1;
    }
    .terms {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      color: #5c6d84;
    }
    .terms input {
      width: auto;
      transform: translateY(1px);
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }
    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 0.16s ease, background-color 0.16s ease;
    }
    .btn-primary {
      background: #5568ff;
      color: #ffffff;
      min-width: 160px;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      background: #3f55d6;
    }
    .btn-secondary {
      background: #f4f7ff;
      color: #4255a0;
    }
    .small-text {
      color: #62718f;
      font-size: 0.92rem;
    }
    @media (max-width: 520px) {
      .row {
        flex-direction: column;
      }
      .actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Register</h1>
    <p>Create your new account using the form below.</p>
    <form>
      <div class="row">
        <div class="form-group">
          <label for="firstName">First name</label>
          <input class="form-control" type="text" id="firstName" placeholder="Jane">
        </div>
        <div class="form-group">
          <label for="lastName">Last name</label>
          <input class="form-control" type="text" id="lastName" placeholder="Doe">
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input class="form-control" type="email" id="email" placeholder="name@example.com">
      </div>
      <div class="row">
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" placeholder="Choose a password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input class="form-control" type="password" id="confirmPassword" placeholder="Repeat password">
        </div>
      </div>
      <div class="form-group">
        <label for="dob">Date of birth</label>
        <input class="form-control" type="date" id="dob">
      </div>
      <div class="form-group">
        <label for="role">I am a</label>
        <select class="form-select" id="role">
          <option>Student</option>
          <option>Professional</option>
          <option>Designer</option>
          <option>Developer</option>
        </select>
      </div>
      <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">I accept the terms and privacy policy</label>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Register</button>
        <span class="small-text">Already have an account? Sign in</span>
      </div>
    </form>
  </div>
</body>
</html>
